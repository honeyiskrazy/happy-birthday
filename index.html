<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta name="description" content="A special birthday greeting for Sana" />
  <link rel="shortcut icon" type="image/png" href="img/favicon.png" />
  <title>Happy Birthday..!!!!! 🎂</title>
  <!-- Google Fonts — Elegant Calligraphic + Clean -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- Style -->
  <link rel="stylesheet" href="./style/main.css" />

<body>
  <!-- Background Music -->
  <audio class="song" loop autoplay>
    <source src="">
    Your browser isn't invited for super fun audio time.
  </audio>

  <!-- Birthday Bunting Banner -->
  <div class="bunting" id="bunting">
    <div class="bunting-string">
      <span class="flag f-green">H</span>
      <span class="flag f-red">A</span>
      <span class="flag f-yellow">P</span>
      <span class="flag f-purple">P</span>
      <span class="flag f-blue">Y</span>
      <span class="flag gap"></span>
      <span class="flag f-green">B</span>
      <span class="flag f-red">I</span>
      <span class="flag f-blue">R</span>
      <span class="flag f-purple">T</span>
      <span class="flag f-yellow">H</span>
      <span class="flag f-red">D</span>
      <span class="flag f-blue">A</span>
      <span class="flag f-green">Y</span>
    </div>
  </div>

  <!-- All sections are rendered here dynamically from config.js -->
  <div class="container"></div>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Config & Engine -->
  <script src="./config.js"></script>
  <script src="./script/main.js"></script>

</html>
